name: diag-font

on:
  push:

jobs:
  diag:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: markdown-to-pdf/package-lock.json
      - run: npm ci
        working-directory: markdown-to-pdf
      - run: npx playwright install chromium
        working-directory: markdown-to-pdf
      - run: node ../tests/diag-font.cjs
        working-directory: markdown-to-pdf
