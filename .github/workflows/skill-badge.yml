name: skill-badge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-skill-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install agentskills-ci
        run: pip install agentskills-ci
      - name: Generate skill score badge
        run: |
          URL="$(agentskills-ci badge markdown-to-pdf/SKILL.md --format url)"
          mkdir -p badges
          curl -s "${URL}.svg" -o badges/skill-score.svg
      - name: Commit badge update if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add badges/skill-score.svg
            git commit -m "chore: update skill score badge"
            git push
          fi
